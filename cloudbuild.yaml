steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/hexagun-mx/portfolio', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/hexagun-mx/portfolio']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'run'
      - 'deploy'
      - 'portfolio'
      - '--image=gcr.io/hexagun-mx/portfolio'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--timeout=300'  # Increase timeout to 300 seconds (5 minutes)
      - '--set-env-vars=PORT=3000'  # Ensure PORT is set

# Optional: Specify logging options
options:
  logging: CLOUD_LOGGING_ONLY